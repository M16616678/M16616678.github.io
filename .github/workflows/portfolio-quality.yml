name: Portfolio Quality Gate
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: Static type check
        run: npx tsc --noEmit
      - name: Lint (blocking, whole repository)
        run: npm run lint
      - name: Production build (static export)
        run: npm run build
      - name: Validate build output
        run: |
          for f in out/index.html out/404.html out/case-studies/index.html out/case-studies/cfms/index.html out/arcade/index.html out/resume/index.html out/manifest.json out/service-worker.js; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end, responsive and unit tests
        run: npm test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
